name: Metrics

on:
  schedule:
    # Daily at 06:00 Asia/Shanghai (22:00 UTC).
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ccclucky
          template: classic
          base: header, activity
          config_timezone: Asia/Shanghai

          # Keep the contribution calendar; selected merged PRs live in README.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Avoid empty or misleading repository-derived statistics.
          plugin_languages: no
          plugin_lines: no
          plugin_orgs: no
          plugin_notable: no
